version: '3.8'

services:
db:
image: postgres:17
environment:
POSTGRES_USER: postgres
POSTGRES_PASSWORD: postgres
POSTGRES_DB: deals_bigdata
ports:

- "5432:5432"
volumes:
- ./sql/schema.sql:/docker-entrypoint-initdb.d/01_schema.sql
- ./sql/synthetic.sql:/docker-entrypoint-initdb.d/02_synthetic.sql
- ./init_db.sql:/docker-entrypoint-initdb.d/03_init_db.sql
healthcheck:
test: ["CMD-SHELL", "pg_isready -U postgres"]
interval: 5s
timeout: 5s
retries: 5

pipeline:
build: .
depends_on:
db:
condition: service_healthy
environment:
DB_HOST: db
DB_PORT: 5432
DB_USER: postgres
DB_PASSWORD: postgres
DB_NAME: deals_bigdata
command: sh -c "python etl.py && python ml.py"